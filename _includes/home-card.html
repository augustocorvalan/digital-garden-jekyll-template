<a href="{{ include.url }}" class="disable-link-style group relative block">
    <div class="relative flex h-full transform flex-col bg-white transition-transform">
        <div class="aspect-[3/4] w-full overflow-hidden">
            <img src="{{ include.image_url }}" alt="" class="h-full w-full object-cover object-top transition-transform duration-500 ease-in-out group-hover:scale-105">
        </div>
        <div class="flex-1 p-4 lg:pt-4 transition-opacity sm:p-6">
            <h3 class="relative m-0 text-xl font-medium sm:text-2xl transition-colors duration-300 group-hover:text-gray-700">
                {{ include.title }}
                <span class="absolute bottom-0 left-0 h-0.5 w-0 bg-gray-800 transition-all duration-300 ease-out group-hover:w-full"></span>
            </h3>
            <p class="m-0 text-sm sm:text-base">
                {{ include.description }}
            </p>
            <p class="m-0 text-xs text-slate-500">
                {% assign date_string = include.date | strip %}
                {% if date_string contains "-" %}
                    {% assign date_parts = date_string | split: "-" %}
                    {{ date_parts[0] }}
                {% else %}
                    {{ date_string }}
                {% endif %}
            </p>
        </div>
    </div>
</a>
