                border-radius: 50%;

            }

            input[type="radio"]::before {
                content: "";
                width: 0.65em;
                height: 0.65em;
                border-radius: 50%;
                transform: scale(0);
                transition: 120ms transform ease-in-out;
                box-shadow: inset 1em 1em pink;
            }

            input[type="radio"]:checked::before {
                transform: scale(1);
            }

        const state = {
            index: 0,
            data: initialData.slice()
        }
        const handleCheckboxClick = (option, index) => {
            // TODO: doesn't let you select the last option for some reason
            let fragment
            if (index >= state.data.length) {
                fragment = state.data.pop()
            } else {
                fragment = state.data.splice(state.data.length - index - 1, 1)[0];
            }

            if (fragment) {
                createFragment(fragment)
            } else {
                alert('no fragments')
            }

            if (state.data.length === 3) {
                state.data = state.data.concat(initialData)
            }
       }

        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        const createFragment = (item) => {
                const fragment = document.createElement('section')
                fragment.classList.add('fragment')

                const top = getRandomNumber(0, 40)
                const left = getRandomNumber(-5, 25)
                console.log("top", top, "left", left)

                fragment.style.top = `${top}vh`
                fragment.style.left = `${left}vw`
                fragment.style.zIndex = state.index
                fragment.style.padding = `${(state.index*2)+16}px`

                const options = item.options.map((option,i) => {
                    return `<label>
                        <input type="radio" onclick="handleCheckboxClick('${option}',${i})">
                        <span class="option">${option}</span>
                    </label>`
                })

                fragment.innerHTML = `
                    <p class="title">${item.title}</p>
                    <div class="options">${options.join('')}</div>
                `

                state.index = state.index + 1
